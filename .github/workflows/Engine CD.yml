name: Continuous Delivery (CD)

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  cd-pipeline:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            clang-17 \
            libvulkan-dev vulkan-validationlayers vulkan-tools \
            mesa-vulkan-drivers \
            && rm -rf /var/lib/apt/lists/*
          ln -s /usr/bin/clang-17 /usr/bin/clang
          ln -s /usr/bin/clang++-17 /usr/bin/clang++

      - name: Configure CMake (Release mode)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build project
        run: cmake --build build --config Release -j $(nproc)

      - name: Run final validation tests
        run: |
          cd build
          if [ -f bin/run_tests ]; then
            ./bin/run_tests --gtest_brief=1
          else
            echo "Warning: Test executable not found. Skipping validation."
          fi

      - name: Package release artifacts
        run: |
          mkdir -p dist/bin dist/config dist/resources
          find build/bin -type f -executable -exec cp {} dist/bin/ \; 2>/dev/null || true
          [ -d config ] && cp -r config/* dist/config/ || true
          [ -d resources ] && cp -r resources/* dist/resources/ || true
          tar -czvf sky-engine-release.tar.gz -C dist .

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: sky-engine-release.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}

      - name: Publish Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
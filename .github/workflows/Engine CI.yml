name: Engine CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: run build
      run: ./build.sh

  unit-tests:

    runs-on: ubuntu-latest

    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: run build
      run: ./build.sh
    - name: run tests
      run: ./run-test.sh

  static-analysis:

    runs-on: ubuntu-latest

    needs: [build, unit-tests]

    steps:
    - uses: actions/checkout@v4
    - name: run tests
      run: ./run-test.sh

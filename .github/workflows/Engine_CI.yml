name: Engine CI
on: [push, pull_request]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t vulkan-ci -f Dockerfile.ci .
          docker run --rm vulkan-ci bash -c "
            cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON &&
            cmake --build build -j$(nproc)
          "

  static-analysis:
    runs-on: ubuntu-latest
    needs: compile-check
    steps:
      - uses: actions/checkout@v4
      - name: Clang-Tidy + Cppcheck
        run: |
          docker run --rm vulkan-ci bash -c "
            cmake -B build -S . -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON &&
            clang-tidy -p build/compile_commands.json 'src/**/*.cpp' -- -- -DCMAKE_BUILD_TYPE=Release &&
            cppcheck --enable=all --inconclusive --std=c++17 src/
          "

  unit-tests:
    runs-on: ubuntu-latest
    needs: compile-check
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: |
          docker run --rm vulkan-ci bash -c "
            cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON &&
            cmake --build build -j$(nproc) &&
            ctest --test-dir build --output-on-failure --parallel $(nproc)
          "

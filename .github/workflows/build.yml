name: Build CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: run build
      run: ./build.sh
    - name: pulling binary
      uses: actions/upload-artifact@v4
      with:
        name: binary
        path: build/LestaAcademyTestTask/LestaAcademyTestTask
        if-no-files-found: error # Ошибка, если файл не найден
        retention-days: 1        # Хранить 1 день (экономия места)
  tests:

    runs-on: ubuntu-latest

    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: run build
      run: ./build.sh
    - name: run tests
      run: ./run-test.sh
    # - name: make check
    #   run: make check
    # - name: make distcheck
    #   run: make distcheck
